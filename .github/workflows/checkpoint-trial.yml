name: Checkpoint trial
on:
  push:
    branches: [codex/parallel-checkpoint]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run two serial checkpoint baselines
        type: boolean
        default: false

permissions:
  contents: read

env:
  TELEPORT_VALIDATION_EXTERNAL: '1'

jobs:
  synthetic-plan:
    name: Plan admitted synthetic batches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: plan
        run: echo "matrix=$(node scripts/synthetic-ci.mjs plan)" >> "$GITHUB_OUTPUT"

  synthetic:
    name: Synthetic evaluations — group ${{ matrix.group }}
    needs: synthetic-plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.synthetic-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/synthetic-ci.mjs run '${{ matrix.group }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-${{ matrix.group }}
          overwrite: true
          path: .cache/synthetic-ci
          include-hidden-files: true

  synthetic-results:
    name: Complete synthetic evaluation evidence
    needs: synthetic
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: synthetic-*
          path: .cache/synthetic-ci
          merge-multiple: true
      - run: node scripts/synthetic-ci.mjs combine
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-evaluations
          overwrite: true
          path: challenges/evaluations/ci-v*.json

  # Two identical baselines measure timing noise on the hosted runners.
  serial:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    name: Serial checkpoint — baseline ${{ matrix.repeat }}
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/checkpoint-checks.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: serial-${{ matrix.repeat }}
          path: |
            .cache/checkpoint-summary.json
            .cache/development-standing.json
            .cache/session-results.json
          include-hidden-files: true

  stage:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: tests-1
            name: Tests — goal lifecycle and shard 1
          - group: tests-2
            name: Tests — worker delivery and shard 2
          - group: tests-3
            name: Tests — checkpoint isolation and shard 3
          - group: tests-4
            name: Tests — remaining shard 4
          - group: sources
            name: Generated data and source checks
          - group: score
            name: Fixed development score — 44 sessions
          - group: recordings-1
            name: Regression recordings — batch 1 of 4
          - group: recordings-2
            name: Regression recordings — batch 2 of 4
          - group: recordings-3
            name: Regression recordings — batch 3 of 4
          - group: recordings-4
            name: Regression recordings — batch 4 of 4
          - group: scan
            name: Mismatch scan and input-boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/checkpoint-stage.mjs run '${{ matrix.group }}' .cache/checkpoint-stages
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage-${{ matrix.group }}
          overwrite: true
          path: .cache/checkpoint-stages
          include-hidden-files: true

  combine:
    name: Combined checkpoint result
    needs: stage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: stage-*
          path: .cache/checkpoint-stages
          merge-multiple: true
      - run: node scripts/checkpoint-stage.mjs combine .cache/checkpoint-stages
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parallel-checkpoint
          overwrite: true
          path: .cache/checkpoint-stages
          include-hidden-files: true
