name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/early only (throwaway): record on macOS the 41 batch games
# that ended earlier on macOS than on Linux, cut to the keys macOS consumed.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh 2>&1 | tail -3
      - name: Record
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; sw_vers; uname -a; } | tee macos-recordings/host.txt
          experiments/host-parity/record-sample.sh macos-recordings/early 3 experiments/host-parity/early/*.session.json || true
          cat macos-recordings/early/failed.txt || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-early
          path: macos-recordings/
          if-no-files-found: error
