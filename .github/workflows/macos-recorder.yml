name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/arbitrate only (throwaway): record on macOS five fuzz cases
# in which the port, the reference fork and the Linux recorder disagree.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh
      - name: Record
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; sw_vers; uname -a; } | tee macos-recordings/host.txt
          experiments/host-parity/record-sample.sh macos-recordings/arbitrate 3 experiments/host-parity/arbitrate/*.session.json || true
          cat macos-recordings/arbitrate/failed.txt || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-arbitrate
          path: macos-recordings/
          if-no-files-found: error
