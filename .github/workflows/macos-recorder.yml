name: macOS recorder
on:
  workflow_dispatch:

# Branch integration-checkpoint/macos-rerecord-rec only (throwaway): re-record
# every committed recipe that has a Linux recording, on macOS, with the
# recorder built from this repository's patch set, to compare the two hosts
# byte for byte. This commit runs one job that re-records the differing games.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
          } | tee macos-recordings/host.txt

      # Second macOS recording of each game that differed from its Linux
      # recording (experiments/host-parity/confirm.txt), to confirm the
      # difference before calling it a host difference.
      - name: Record the games to confirm
        run: experiments/host-parity/record-sample.sh macos-recordings/confirm 2 $(cat experiments/host-parity/confirm.txt) || true

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-confirm
          path: macos-recordings/
          if-no-files-found: error
