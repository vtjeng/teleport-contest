name: macOS recorder
on:
  workflow_dispatch:

# Throwaway copy for integration-checkpoint/qsort-oracle: one job that asks
# the qsort oracle and records the sort-order recipes, twice, so the two
# recordings can be compared. The workflow on the branch qsort-macos-order
# keeps every other step.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
          } | tee macos-recordings/host.txt

      - name: Ask the qsort oracle
        if: always()
        run: experiments/host-parity/qsort-oracle/run-oracle.sh macos-recordings/qsort-oracle
      - name: Record the sort-order recipes
        if: always()
        run: >-
          experiments/host-parity/record-sample.sh macos-recordings/sortloot 2
          $(cat experiments/host-parity/qsort-oracle/recipes.txt)
      - name: Record the sort-order recipes a second time
        if: always()
        run: >-
          experiments/host-parity/record-sample.sh macos-recordings/sortloot-second 2
          $(cat experiments/host-parity/qsort-oracle/recipes.txt)

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings
          path: macos-recordings/
          if-no-files-found: error
