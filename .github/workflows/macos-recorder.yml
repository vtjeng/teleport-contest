name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/new-recipes only (throwaway): record on macOS the 58 recipes
# added since the first macOS re-recording (experiments/host-parity/new-recipes.txt),
# whose committed recordings were made on Linux, to compare the two hosts.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh
      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; sw_vers; uname -a; clang --version | head -n 1; node --version; } | tee macos-recordings/host.txt
      - name: Record the recipes, one directory at a time
        run: |
          for dir in $(cut -d/ -f2 experiments/host-parity/new-recipes.txt | sort -u); do
            experiments/host-parity/record-sample.sh "macos-recordings/$dir" 3 $(grep "^recipes/$dir/" experiments/host-parity/new-recipes.txt) || true
          done
          cat macos-recordings/*/failed.txt | wc -l
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-new
          path: macos-recordings/
          if-no-files-found: error
