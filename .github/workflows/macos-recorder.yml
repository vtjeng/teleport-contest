name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/namelen only (throwaway): find the character-name length at
# which picking a saved game from the menu aborts on macOS.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh 2>&1 | tee build.log | tail -5
      - name: Record
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; sw_vers; uname -a; clang --version | head -n 1; } | tee macos-recordings/host.txt
          grep -o -- '-D_FORTIFY_SOURCE[=0-9]*\|-O[0-3s]\b' build.log | sort | uniq -c | tee -a macos-recordings/host.txt || true
          experiments/host-parity/record-sample.sh macos-recordings/namelen 3 experiments/host-parity/namelen/*.session.json || true
          cat macos-recordings/namelen/failed.txt || true
          tail -n 4 macos-recordings/namelen/logs/*.log || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-namelen
          path: macos-recordings/
          if-no-files-found: error
