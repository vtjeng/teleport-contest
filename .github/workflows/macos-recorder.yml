name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/abort3 only (throwaway): record on macOS three batch-18 games up to
# and including the key at which macOS aborts (terminalSignal SIGABRT).

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh
      - name: Record
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; sw_vers; uname -a; } | tee macos-recordings/host.txt
          experiments/host-parity/record-sample.sh macos-recordings/abort3 3 experiments/host-parity/abort3/*.session.json || true
          cat macos-recordings/abort3/failed.txt || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-abort3
          path: macos-recordings/
          if-no-files-found: error
