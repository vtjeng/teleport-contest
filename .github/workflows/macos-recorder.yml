name: macOS recorder
on:
  workflow_dispatch:

# Branch integration-checkpoint/macos-rerecord-batch only (throwaway): record
# the passing games of batches 8 and 5 (saves and restores) on macOS, with the
# recorder built from this repository's patch set, and replay each recording
# with the port. The port matches these games' Linux recordings, so a game that
# fails here differs between the hosts. Ten jobs run one at a time
# (max-parallel 1: a quarter of the account's five concurrent macOS jobs,
# rounded down); each holds about 600 games.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [b8, b5]
        chunk: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-batch
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
          } | tee macos-batch/host.txt

      - name: Record and replay the chunk
        run: experiments/host-parity/batch-check.sh macos-batch ${{ matrix.batch }} ${{ matrix.chunk }} 5

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-batch-${{ matrix.batch }}-${{ matrix.chunk }}
          path: macos-batch/
          if-no-files-found: error
