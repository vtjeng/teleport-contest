name: macOS recorder
on:
  workflow_dispatch:

# Throwaway branch integration-checkpoint/case-open-rec2 only: records two
# probes of APFS's Unicode name folding.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
            diskutil info / | grep -i -E 'file system|case' || true
          } | tee macos-recordings/host.txt

      - name: Record the Unicode fold probes
        if: always()
        run: experiments/host-parity/record-sample.sh macos-recordings/probes2 2 experiments/host-parity/case-open/probes2/*.session.json

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings
          path: macos-recordings/
          if-no-files-found: error
