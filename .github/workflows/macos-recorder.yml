name: macOS recorder
on:
  workflow_dispatch:

# Branch integration-checkpoint/macos-clock only (throwaway): run the clock
# driver (experiments/host-parity/clock/), which applies the recorder's
# fixed-datetime conversion (calendar.c time_from_yyyymmddhhmmss() with
# patches 001 and 009) on this host's C library, TZ=America/New_York.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run the clock driver
        run: experiments/host-parity/clock/run.sh experiments/host-parity/clock/grid.txt macos-clock
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-clock
          path: macos-clock/
          if-no-files-found: error
