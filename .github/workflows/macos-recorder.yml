name: macOS recorder
on:
  workflow_dispatch:

# Branch integration-checkpoint/macos-rerecord-rec only (throwaway): re-record
# every committed recipe that has a Linux recording, on macOS, with the
# recorder built from this repository's patch set, to compare the two hosts
# byte for byte. Eight jobs run one at a time (max-parallel 1: a quarter of
# the account's five concurrent macOS jobs, rounded down).

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
          } | tee macos-recordings/host.txt

      # record-sample.sh exits 1 when a recipe fails to record; the failures
      # are listed in each directory's failed.txt, so the step continues.
      - name: Record the chunk
        run: |
          node experiments/host-parity/corpus-list.mjs macos-recordings ${{ matrix.chunk }} 8
          for list in macos-recordings/lists/*.txt; do
            dir="$(basename "$list" .txt)"
            experiments/host-parity/record-sample.sh "macos-recordings/$dir" 4 $(cat "$list") || true
          done
          cat macos-recordings/*/failed.txt | wc -l

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-${{ matrix.chunk }}
          path: macos-recordings/
          if-no-files-found: error
