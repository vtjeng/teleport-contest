name: macOS recorder
on:
  workflow_dispatch:

# The judge's reference recordings were made on macOS; local recordings are
# made on Linux. This workflow builds the C recorder on macOS, records the
# host-parity sample (experiments/host-parity/recipes/) and uploads the
# recordings, so scripts/compare-host-recordings.mjs can list every screen
# that differs between the two hosts. docs/testing.md, "Local recordings and
# the judge's host", gives the whole procedure.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # nethack-c/build-recorder.sh builds from the NetHack source in
          # the nethack-c/upstream submodule.
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
          } | tee macos-recordings/host.txt

      # Branch recorder/competitor-probes-2 only (throwaway): the recipes
      # branch competitor-probes adds, recorded on the judge's host.
      - name: Record the competitor probes
        run: >-
          experiments/host-parity/record-sample.sh macos-recordings/competitor-probes 3
          recipes/save.c/save-name-cut-mid-utf8-save-last.session.json recipes/save.c/save-name-cut-mid-utf8-play-on.session.json recipes/save.c/save-name-cut-mid-utf8-restore.session.json recipes/save.c/save-name-valid-utf8-restore.session.json recipes/topten.c/score-list-four-byte-name-namsz-cut.session.json recipes/cfgfiles.c/config-error-long-utf8-line-col80-split.session.json recipes/unixmain.c/askname-save-restore.session.json recipes/weapon.c/enhance-advance-paging-debug.session.json recipes/mkobj.c/crysknife-fixed-drop-debug.session.json recipes/pager.c/whatis-long-dogname-wrap.session.json recipes/pager.c/whatdoes-hint-after-restore.session.json recipes/end.c/disclose-auto-inventory-quit.session.json recipes/pager.c/whatis-typed-comma-name.session.json recipes/cmd.c/altmeta-esc-in-menu.session.json recipes/options.c/dogname-high-bytes-sanitized.session.json

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings
          path: macos-recordings/
          if-no-files-found: error
