name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/menu-search only (throwaway): record the saved-games menu
# search recipe on macOS in three forms, to see whether ':' at that menu ends
# the game with a signal there as it does in the Linux recorder.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh
      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; sw_vers; uname -a; clang --version | head -n 1; node --version; } | tee macos-recordings/host.txt
      - name: Record the three forms
        run: experiments/host-parity/record-sample.sh macos-recordings/menu-search 1 experiments/host-parity/menu-search/*.session.json || true
      - name: Symbols around wins[]
        run: nm -n nethack-c/recorder/install/games/lib/nethackdir/nethack | grep -B6 -A2 ' _wins$' | tee macos-recordings/wins-symbols.txt || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-menu-search
          path: macos-recordings/
          if-no-files-found: error
