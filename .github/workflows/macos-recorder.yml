name: macOS recorder
on:
  workflow_dispatch:

# Branch recorder/macos-abort-recordings only (throwaway): record on macOS,
# twice each, the three recipes whose games end in SIGABRT there
# (terminalSignal), plus probes of the saved-games menu search that are not
# committed.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh
      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          { echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; sw_vers; uname -a; clang --version | head -n 1; node --version; } | tee macos-recordings/host.txt
      - name: Record the committed recipes twice
        run: |
          for run in run1 run2; do
            experiments/host-parity/record-sample.sh "macos-recordings/$run/restore.c" 1 \
              recipes/restore.c/restore_menu-long-name-pick-aborts.session.json || true
            experiments/host-parity/record-sample.sh "macos-recordings/$run/pager.c" 1 \
              recipes/pager.c/do_screen_description-engraving-text-226-aborts.session.json || true
            experiments/host-parity/record-sample.sh "macos-recordings/$run/getline.c" 1 \
              recipes/getline.c/menu-search-before-message-window.session.json || true
          done
          for f in macos-recordings/run*/*/logs/*.log; do echo "== $f"; cat "$f"; done
      - name: Record the probes
        if: always()
        run: |
          experiments/host-parity/record-sample.sh macos-recordings/probes 2 experiments/host-parity/macos-aborts/*.session.json || true
          cat macos-recordings/probes/failed.txt || true
          for f in macos-recordings/probes/logs/*.log; do echo "== $f"; cat "$f"; done
      - name: Symbols around wins[]
        if: always()
        run: nm -n nethack-c/recorder/install/games/lib/nethackdir/nethack | grep -B6 -A2 ' _wins$' | tee macos-recordings/wins-symbols.txt || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-aborts
          path: macos-recordings/
          if-no-files-found: error
