name: macOS recorder
on:
  workflow_dispatch:

# Branch integration-checkpoint/macos-rerecord-batch2 only (throwaway): record
# the passing games of the remaining batches on macOS, with the recorder built
# from this repository's patch set, and replay each recording with the port.
# The port matches these games' Linux recordings, so a game that fails here
# differs between the hosts. 74 jobs of about 600 games run two at a time;
# with the one job of the batch 8 and 5 run that makes three of the account's
# five concurrent macOS jobs.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { batch: b10, chunk: 0, chunks: 5 }
          - { batch: b10, chunk: 1, chunks: 5 }
          - { batch: b10, chunk: 2, chunks: 5 }
          - { batch: b10, chunk: 3, chunks: 5 }
          - { batch: b10, chunk: 4, chunks: 5 }
          - { batch: b9, chunk: 0, chunks: 5 }
          - { batch: b9, chunk: 1, chunks: 5 }
          - { batch: b9, chunk: 2, chunks: 5 }
          - { batch: b9, chunk: 3, chunks: 5 }
          - { batch: b9, chunk: 4, chunks: 5 }
          - { batch: b6, chunk: 0, chunks: 5 }
          - { batch: b6, chunk: 1, chunks: 5 }
          - { batch: b6, chunk: 2, chunks: 5 }
          - { batch: b6, chunk: 3, chunks: 5 }
          - { batch: b6, chunk: 4, chunks: 5 }
          - { batch: b7, chunk: 0, chunks: 5 }
          - { batch: b7, chunk: 1, chunks: 5 }
          - { batch: b7, chunk: 2, chunks: 5 }
          - { batch: b7, chunk: 3, chunks: 5 }
          - { batch: b7, chunk: 4, chunks: 5 }
          - { batch: b11, chunk: 0, chunks: 3 }
          - { batch: b11, chunk: 1, chunks: 3 }
          - { batch: b11, chunk: 2, chunks: 3 }
          - { batch: b12, chunk: 0, chunks: 3 }
          - { batch: b12, chunk: 1, chunks: 3 }
          - { batch: b12, chunk: 2, chunks: 3 }
          - { batch: b13, chunk: 0, chunks: 3 }
          - { batch: b13, chunk: 1, chunks: 3 }
          - { batch: b13, chunk: 2, chunks: 3 }
          - { batch: b14, chunk: 0, chunks: 3 }
          - { batch: b14, chunk: 1, chunks: 3 }
          - { batch: b14, chunk: 2, chunks: 3 }
          - { batch: b15, chunk: 0, chunks: 1 }
          - { batch: b16, chunk: 0, chunks: 1 }
          - { batch: b17, chunk: 0, chunks: 1 }
          - { batch: b18, chunk: 0, chunks: 1 }
          - { batch: b20, chunk: 0, chunks: 1 }
          - { batch: b23, chunk: 0, chunks: 1 }
          - { batch: b4, chunk: 0, chunks: 9 }
          - { batch: b4, chunk: 1, chunks: 9 }
          - { batch: b4, chunk: 2, chunks: 9 }
          - { batch: b4, chunk: 3, chunks: 9 }
          - { batch: b4, chunk: 4, chunks: 9 }
          - { batch: b4, chunk: 5, chunks: 9 }
          - { batch: b4, chunk: 6, chunks: 9 }
          - { batch: b4, chunk: 7, chunks: 9 }
          - { batch: b4, chunk: 8, chunks: 9 }
          - { batch: b1, chunk: 0, chunks: 9 }
          - { batch: b1, chunk: 1, chunks: 9 }
          - { batch: b1, chunk: 2, chunks: 9 }
          - { batch: b1, chunk: 3, chunks: 9 }
          - { batch: b1, chunk: 4, chunks: 9 }
          - { batch: b1, chunk: 5, chunks: 9 }
          - { batch: b1, chunk: 6, chunks: 9 }
          - { batch: b1, chunk: 7, chunks: 9 }
          - { batch: b1, chunk: 8, chunks: 9 }
          - { batch: b2, chunk: 0, chunks: 9 }
          - { batch: b2, chunk: 1, chunks: 9 }
          - { batch: b2, chunk: 2, chunks: 9 }
          - { batch: b2, chunk: 3, chunks: 9 }
          - { batch: b2, chunk: 4, chunks: 9 }
          - { batch: b2, chunk: 5, chunks: 9 }
          - { batch: b2, chunk: 6, chunks: 9 }
          - { batch: b2, chunk: 7, chunks: 9 }
          - { batch: b2, chunk: 8, chunks: 9 }
          - { batch: b3, chunk: 0, chunks: 9 }
          - { batch: b3, chunk: 1, chunks: 9 }
          - { batch: b3, chunk: 2, chunks: 9 }
          - { batch: b3, chunk: 3, chunks: 9 }
          - { batch: b3, chunk: 4, chunks: 9 }
          - { batch: b3, chunk: 5, chunks: 9 }
          - { batch: b3, chunk: 6, chunks: 9 }
          - { batch: b3, chunk: 7, chunks: 9 }
          - { batch: b3, chunk: 8, chunks: 9 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-batch
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
          } | tee macos-batch/host.txt

      - name: Record and replay the chunk
        run: experiments/host-parity/batch-check.sh macos-batch ${{ matrix.batch }} ${{ matrix.chunk }} ${{ matrix.chunks }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-batch-${{ matrix.batch }}-${{ matrix.chunk }}
          path: macos-batch/
          if-no-files-found: error
