name: macOS recorder
on:
  workflow_dispatch:

# Throwaway branch integration-checkpoint/case-open-* only: records the
# case-insensitive file-name recipes (recipes/files.c/*case*), a non-ASCII
# name probe, and the three b13 games whose macOS game ends before the Linux
# key list is used up (record-trim.mjs cuts them to the keys C read).

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
            diskutil info / | grep -i -E 'file system|case' || true
          } | tee macos-recordings/host.txt

      - name: Record the case-insensitive file-name recipes
        if: always()
        run: >-
          experiments/host-parity/record-sample.sh macos-recordings/files.c 4
          recipes/files.c/wizloaddes-case-variant-names.session.json
          recipes/files.c/wizloadlua-case-variant-files.session.json
          recipes/files.c/wizkit-home-config-upper-case.session.json
          recipes/files.c/save-restore-name-case.session.json

      - name: Record the non-ASCII name probe
        if: always()
        run: experiments/host-parity/record-sample.sh macos-recordings/probes 2 experiments/host-parity/case-open/probes/*.session.json

      - name: Record the trimmed b13 games
        if: always()
        run: TMPDIR=/tmp node experiments/host-parity/record-trim.mjs macos-recordings/trim 3 experiments/host-parity/case-open/trim/*.session.json

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings
          path: macos-recordings/
          if-no-files-found: error
