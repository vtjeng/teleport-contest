name: macOS recorder
on:
  workflow_dispatch:

# Branch integration-checkpoint/sortorder-macos only (throwaway): record, on
# macOS, the seven batch and pilot games whose Linux recordings list
# discoveries in glibc's qsort() order, with the recorder built from this
# repository's patch set. Each game is recorded twice, into two directories,
# and the two recordings are compared byte for byte.

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build the recorder
        run: bash nethack-c/build-recorder.sh

      - name: Describe the host
        run: |
          mkdir -p macos-recordings
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            sw_vers
            uname -a
            clang --version | head -n 1
            node --version
            diskutil info / | grep -i -E 'file system|case' || true
          } | tee macos-recordings/host.txt

      # TMPDIR=/tmp as in record-sample.sh. record-trim.mjs cuts a segment
      # whose macOS game ends early to the keys C read and lists it in
      # trims.jsonl; none is expected here.
      - name: Record the games, first time
        run: TMPDIR=/tmp node experiments/host-parity/record-trim.mjs macos-recordings/a 3 experiments/host-parity/sortorder/*.session.json

      - name: Record the games, second time
        if: always()
        run: TMPDIR=/tmp node experiments/host-parity/record-trim.mjs macos-recordings/b 3 experiments/host-parity/sortorder/*.session.json

      - name: Compare the two recordings of each game
        if: always()
        run: |
          rc=0
          for f in macos-recordings/a/*.session.json; do
            n=$(basename "$f")
            if cmp -s "$f" "macos-recordings/b/$n"; then echo "identical $n $(shasum -a 256 "$f" | cut -d' ' -f1)"; else echo "DIFFERENT $n"; rc=1; fi
          done | tee macos-recordings/identical.txt
          ! grep -q DIFFERENT macos-recordings/identical.txt

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-recordings-sortorder
          path: macos-recordings/
          if-no-files-found: error
