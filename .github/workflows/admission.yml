name: Admission
on:
  push:
    branches: ['integration-checkpoint/admission/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  TELEPORT_VALIDATION_EXTERNAL: '1'
jobs:
  plan:
    name: Validate new manifests and plan baselines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: plan
        run: echo "matrix=$(node scripts/admission-ci.mjs plan)" >> "$GITHUB_OUTPUT"
  baseline:
    name: New-case baselines — group ${{ matrix.group }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/admission-ci.mjs run '${{ matrix.group }}'
      - uses: actions/upload-artifact@v7
        with:
          name: admission-group-${{ matrix.group }}
          path: .cache/admission-ci
          include-hidden-files: true
  combine:
    name: Save complete admission evidence
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: admission-group-*
          path: .cache/admission-ci
          merge-multiple: true
      - run: node scripts/admission-ci.mjs combine
      - uses: actions/upload-artifact@v7
        with:
          name: admission-baselines
          path: |
            .cache/admission-ci/summary.json
            challenges/evaluations/admission-*.json
          include-hidden-files: true
