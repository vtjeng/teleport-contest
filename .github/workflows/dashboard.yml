name: Dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # dashboard-data.mjs derives timings from the complete Git history.
          fetch-depth: 0
      # The mismatch queue reads the C function index from the NetHack
      # submodule; without it the page shows the queue as unavailable. One
      # commit at depth 1 is enough, since nothing reads that history.
      - name: Check out the C source
        run: git submodule update --init --depth 1 -- nethack-c/upstream
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build dashboard
        run: |
          mkdir _site
          node scripts/build-dashboard.mjs _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
